name: Scheduled Deploy

on:
  schedule:
    # Runs daily at 5:00 AM UTC (midnight EST / 1 AM EDT), just after a post's
    # pubDate begins in Eastern time. pubDates without a time are midnight UTC.
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_SCHEDULE }}"
